# Static file servers for testing HTTP Range requests on growing LDES pages (perf/range/servers/probe.mjs).
# All serve reports/range-www (git-ignored), which the probe writes and appends to.
services:
    nginx-plain:
        image: nginx:1.27-alpine
        ports: ["8081:80"]
        volumes: ["../../../reports/range-www:/www:ro", "./conf/nginx-plain.conf:/etc/nginx/conf.d/default.conf:ro"]
    nginx-gzip:
        image: nginx:1.27-alpine
        ports: ["8082:80"]
        volumes: ["../../../reports/range-www:/www:ro", "./conf/nginx-gzip.conf:/etc/nginx/conf.d/default.conf:ro"]
    httpd-plain:
        image: httpd:2.4-alpine
        ports: ["8083:80"]
        volumes: ["../../../reports/range-www:/www:ro", "./conf/httpd-plain.conf:/usr/local/apache2/conf/httpd.conf:ro"]
    httpd-deflate:
        image: httpd:2.4-alpine
        ports: ["8084:80"]
        volumes: ["../../../reports/range-www:/www:ro", "./conf/httpd-deflate.conf:/usr/local/apache2/conf/httpd.conf:ro"]
    caddy-gzip:
        image: caddy:2-alpine
        ports: ["8085:80"]
        volumes: ["../../../reports/range-www:/www:ro", "./conf/Caddyfile:/etc/caddy/Caddyfile:ro"]
    python:
        image: python:3.12-alpine
        ports: ["8086:80"]
        working_dir: /www
        command: ["python", "-m", "http.server", "80"]
        volumes: ["../../../reports/range-www:/www:ro"]
    # Caching proxies in front of the origins above (perf/range/servers/cache-probe.mjs)
    cache-plain:
        image: nginx:1.27-alpine
        ports: ["8091:80"]
        volumes: ["./conf/cache-plain.conf:/etc/nginx/conf.d/default.conf:ro"]
        depends_on: [nginx-plain]
    cache-gzip-gunzip:
        image: nginx:1.27-alpine
        ports: ["8092:80"]
        volumes: ["./conf/cache-gzip-gunzip.conf:/etc/nginx/conf.d/default.conf:ro"]
        depends_on: [nginx-gzip]
    cache-gzip:
        image: nginx:1.27-alpine
        ports: ["8093:80"]
        volumes: ["./conf/cache-gzip.conf:/etc/nginx/conf.d/default.conf:ro"]
        depends_on: [nginx-gzip]
    cache-slice:
        image: nginx:1.27-alpine
        ports: ["8094:80"]
        volumes: ["./conf/cache-slice.conf:/etc/nginx/conf.d/default.conf:ro"]
        depends_on: [nginx-plain]
    varnish:
        image: varnish:7.6-alpine
        ports: ["8095:80"]
        volumes: ["./conf/varnish.vcl:/etc/varnish/default.vcl:ro"]
        depends_on: [nginx-gzip]
    cache-edge-gzip:
        image: nginx:1.27-alpine
        ports: ["8096:80"]
        volumes: ["./conf/cache-edge-gzip.conf:/etc/nginx/conf.d/default.conf:ro"]
        depends_on: [nginx-plain]
