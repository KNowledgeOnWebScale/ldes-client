# nginx with on-the-fly gzip for RDF types, as is common in production
server {
    listen 80;
    root /www;
    types { application/trig trig; application/x-jelly-rdf jelly; application/gzip gz; }
    gzip on;
    gzip_min_length 0;
    gzip_types application/trig application/x-jelly-rdf;
    # Also compress for proxies and CDNs (by default nginx does not compress requests with a Via header)
    gzip_proxied any;
}
