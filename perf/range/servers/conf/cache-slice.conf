# A cache that stores large objects in slices of 4 KB, as CDNs do for large files: each slice is fetched with a Range
# from the origin and cached on its own, so the slices of a growing file can come from different versions.
proxy_cache_path /tmp/cache levels=1:2 keys_zone=c:10m use_temp_path=off;
server {
    listen 80;
    location / {
        slice 4k;
        proxy_pass http://nginx-plain;
        proxy_set_header Range $slice_range;
        proxy_cache c;
        proxy_cache_key $uri$slice_range;
        proxy_cache_valid 200 206 5s;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
