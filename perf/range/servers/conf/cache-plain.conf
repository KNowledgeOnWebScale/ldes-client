# A caching reverse proxy in front of the origin, as a CDN: the cache key ignores Accept-Encoding, objects live 5 s.
# On a miss, nginx fetches the whole object (without the Range) and serves ranges from the cached copy.
proxy_cache_path /tmp/cache levels=1:2 keys_zone=c:10m use_temp_path=off;
server {
    listen 80;
    location / {
        proxy_pass http://nginx-plain;
        proxy_cache c;
        proxy_cache_key $uri;
        proxy_cache_valid 200 206 5s;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
