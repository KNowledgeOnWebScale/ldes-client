# A cache that compresses at the edge (as Cloudflare does): it caches the uncompressed object from the origin, and
# compresses responses for clients that accept gzip.
proxy_cache_path /tmp/cache levels=1:2 keys_zone=c:10m use_temp_path=off;
server {
    listen 80;
    gzip on;
    gzip_min_length 0;
    gzip_types application/trig application/x-jelly-rdf;
    location / {
        proxy_pass http://nginx-plain;
        proxy_cache c;
        proxy_cache_key $uri;
        proxy_cache_valid 200 206 5s;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
