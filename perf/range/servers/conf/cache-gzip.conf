# The same, without decompression: the cached gzip variant is what every client gets.
proxy_cache_path /tmp/cache levels=1:2 keys_zone=c:10m use_temp_path=off;
server {
    listen 80;
    location / {
        proxy_pass http://nginx-gzip;
        # HTTP/1.1 to the origin: nginx only compresses HTTP/1.1 requests (gzip_http_version)
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding gzip;
        proxy_cache c;
        proxy_cache_key $uri;
        proxy_cache_valid 200 206 5s;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
